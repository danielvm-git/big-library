name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-cd:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 0. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 1. Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git
          npx semantic-release

      - name: 2. Build Web
        run: |
          npm ci
          npm run build

      - name: 3. Build Go MCP Server
        run: |
          cd mcp-server
          go build -o mcp-server main.go

      - name: 4. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            mcp-server/mcp-server
          retention-days: 1

      - name: 5. Tests
        run: |
          # Web Tests
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          fi
          # Go Tests
          cd mcp-server
          if ls *_test.go 1> /dev/null 2>&1; then
            go test ./...
          fi

      - name: 6. Deploy
        env:
          BIGBASE_DEPLOY_TOKEN: ${{ secrets.BIGBASE_DEPLOY_TOKEN }}
          BIGBASE_SITE_ID: ${{ secrets.BIGBASE_SITE_ID }}
        run: |
          if [ -z "${BIGBASE_DEPLOY_TOKEN}" ]; then
            echo "::error::BIGBASE_DEPLOY_TOKEN not set — provision via bigbase_provision_ci_credentials"
            exit 1
          fi
          # Capture the HTTP status. Without this a 401/403/500 from the deploy
          # API is swallowed (curl -s exits 0 on HTTP errors), the job continues,
          # and step 7 then gets a 200 from the PREVIOUS deployment and reports
          # "Site is LIVE" for a deploy that never happened.
          HTTP_CODE=$(curl -sS -o /tmp/deploy_response.json -w '%{http_code}' \
            -X POST https://bigbase.click/api/sites/${BIGBASE_SITE_ID}/deploy \
            -H "Authorization: Bearer ${BIGBASE_DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"branch": "main", "app_type": "static", "passthrough_paths": ["/mcp"]}')
          echo "Deploy API returned HTTP ${HTTP_CODE}"
          cat /tmp/deploy_response.json || true
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Deploy API failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: 7. Health Check
        run: |
          SITE_URL="${{ vars.BIGBASE_SITE_URL || 'https://library.bigbase.click' }}"
          echo "Checking health for $SITE_URL"
          for i in {1..8}; do
            status_code=$(curl -o /dev/null -s -w "%{http_code}\n" $SITE_URL)
            if [ "$status_code" -eq 200 ]; then
              echo "✅ Site is LIVE and healthy!"
              exit 0
            fi
            echo "Attempt $i/8: Got HTTP $status_code. Retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 8 attempts."
          exit 1

      - name: 8. Summary
        if: always()
        run: |
          echo "### Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ vars.BIGBASE_SITE_URL || 'https://library.bigbase.click' }}" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
