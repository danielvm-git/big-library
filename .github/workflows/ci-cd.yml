name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-cd:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 0. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 1. Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g semantic-release @semantic-release/changelog @semantic-release/git
          npx semantic-release

      - name: 2. Build Web
        run: |
          npm ci
          npm run build

      - name: 3. Build Go MCP Server
        run: |
          cd mcp-server
          go build -o mcp-server main.go

      - name: 4. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            mcp-server/mcp-server
          retention-days: 1

      - name: 5. Tests
        run: |
          # Web Tests
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          fi
          # Go Tests
          cd mcp-server
          if ls *_test.go 1> /dev/null 2>&1; then
            go test ./...
          fi

      - name: 6. Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 3

  # Static Astro build -> Cloudflare Pages. (The Go MCP server under /mcp was
  # a BigBase passthrough and already returned 404 there; it is not hosted.)
  deploy:
    needs: [ci-cd]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: danielvm-git/.github/.github/workflows/deploy-cloudflare-pages.yml@0dc0feae39d0bb932a0999ee4f8dde35fb1b702d # danielvm-git/.github main (#46)
    with:
      project: danielvm-library
      domain: library.danielvm.net
    secrets: inherit
